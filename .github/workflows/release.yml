name: 'Publish Release'

on:
  push:
    tags:
      - 'v*' # Se déclenche lors du push d'un tag (ex: v0.1.2)

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: ubuntu-22.04 # Uniquement une machine Linux
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Dépendances obligatoires pour compiler du Tauri sur Linux
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libdesktop-file-utils libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install

      # Build et création de la release (Correction de la syntaxe de l'action)
      - name: Build and Release Tauri app
        uses: tauri-apps/tauri-action@v2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'App v__VERSION__'
          releaseBody: 'Déploiement automatique Linux de la version v__VERSION__.'
          releaseDraft: true
          prerelease: false