name: 'Publish Release'

on:
  push:
    tags:
      - 'v*' # Se déclenche lors du push d'un tag (ex: v0.1.0)

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Dépendances Linux requises pour Tauri v2
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libdesktop-file-utils libappindicator3-dev librsvg2-dev patchelf

      # Installation des dépendances de votre projet Vite
      - name: install frontend dependencies
        run: npm install

      # Build et création automatique de la release sur GitHub
      - name: Build and Release Tauri v2 app
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'App v__VERSION__'
          releaseBody: 'Déploiement automatique de la version v__VERSION__.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
